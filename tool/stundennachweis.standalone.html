:root{
  --ink:#0A0A0A;
  --line:#a7a9ac;
  --paper:#ffffff;
  --ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --doc:"Rota","Helvetica Neue",Arial,sans-serif;
  --ui-bg:#f4f4f2; --ui-border:#dcdcd7; --ui-muted:#6b6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ui);color:var(--ink);background:#e9e9e6;display:flex;overflow:hidden;font-size:15px}

/* ---- Vorschau (LINKS) ---- */
#preview{flex:1;height:100%;overflow:auto;background:#e9e9e6;padding:30px;display:flex;flex-direction:column;align-items:center;gap:24px}
.stage{display:flex;flex-direction:column;align-items:center;gap:24px}
#toolbar{position:fixed;top:16px;left:24px;display:flex;gap:8px;z-index:20}

/* ---- Editor (RECHTS) ---- */
#editor{
  width:clamp(520px, 50vw, 1040px);min-width:440px;height:100%;overflow:auto;
  background:var(--paper);border-left:1px solid var(--ui-border);padding:30px 36px 90px;order:2;resize:horizontal
}
#editor h1{font-size:21px;font-weight:650;margin:0 0 3px;letter-spacing:-.01em}
#editor .sub{font-size:13px;color:var(--ui-muted);margin:0 0 26px}
#editor h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ui-muted);
  margin:30px 0 14px;border-top:1px solid var(--ui-border);padding-top:20px}
#editor .fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:16px 18px}
#editor .fld{display:flex;flex-direction:column;min-width:0}
#editor .fld.wide{grid-column:1/-1}
#editor label{font-size:12.5px;color:var(--ui-muted);margin:0 0 5px;font-weight:500}
#editor input,#editor textarea{
  width:100%;font-family:var(--ui);font-size:15px;padding:10px 12px;
  border:1px solid var(--ui-border);border-radius:7px;background:#fff;color:var(--ink)
}
#editor input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
button{font-family:var(--ui);font-size:14px;padding:9px 16px;border:1px solid var(--ink);border-radius:7px;
  background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--ink)}
button:disabled{opacity:.4;cursor:not-allowed}
.btnbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* Zeiteinträge */
#entries{margin-top:8px;border:1px solid var(--ui-border);border-radius:8px;overflow:hidden}
#entries .e-head,#entries .e-row{display:grid;grid-template-columns:130px 1fr 1fr 90px 32px}
#entries .e-head{background:var(--ui-bg);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ui-muted)}
#entries .e-head>div{padding:9px 10px}
#entries .e-row>*{border-top:1px solid var(--ui-border)}
#entries input{border:0;border-radius:0;font-size:13.5px;padding:9px 10px}
#entries input:focus{outline:2px solid var(--ink);outline-offset:-2px}
#entries .del{border:0;background:#fff;color:#B0291E;font-size:17px;padding:0;cursor:pointer}
#entries .num{text-align:right}
.e-total{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;padding:11px 10px}

/* ============================================================
   DOKUMENT: A4 nach Design-System
   ============================================================ */
.doc-page{position:relative;width:210mm;height:297mm;background:var(--paper);
  box-shadow:0 3px 18px rgba(0,0,0,.15);overflow:hidden;color:var(--ink);font-family:var(--doc)}
.doc-page .b{position:absolute;white-space:nowrap;overflow:hidden;
  display:flex;align-items:center;line-height:1}            /* Text vertikal mittig im Band */
.doc-page .b.r{justify-content:flex-end;text-align:right}
.doc-page .b.top{align-items:flex-start}
.doc-page .line{position:absolute;height:0;border-top:1px solid var(--line)}
.doc-page .monogram{position:absolute}
.doc-page .monogram svg{display:block;width:100%;height:100%;fill:var(--ink)}

/* Raster-Overlay (Diagnose, wie das Illustrator-Underlay). Ändert das Layout NICHT. */
.doc-page .grid-ov{position:absolute;inset:0;pointer-events:none;z-index:99}
.doc-page .grid-ov .col{position:absolute;top:0;bottom:0;background:rgba(233,30,180,.06);
  border-left:1px solid rgba(233,30,180,.5);border-right:1px solid rgba(233,30,180,.5)}
.doc-page .grid-ov .bl{position:absolute;left:0;right:0;border-top:1px solid rgba(0,150,220,.45)}
.doc-page .grid-ov .frame{position:absolute;border:1px solid rgba(233,30,180,.7)}

.s-wordmark {font-weight:300;font-size:8pt;letter-spacing:.02em;text-transform:uppercase}
.s-title    {font-weight:500;font-size:10pt}
.s-placedate{font-weight:500;font-size:10pt}
.s-metalabel{font-weight:500;font-size:8pt;text-transform:uppercase;letter-spacing:.02em}
.s-metaval  {font-weight:500;font-size:10pt}
.s-thead    {font-weight:500;font-size:8pt;text-transform:uppercase;letter-spacing:.02em}
.s-cell     {font-weight:500;font-size:8pt}
.s-total    {font-weight:700;font-size:8pt}
.s-footer   {font-weight:300;font-size:8pt}

@media print{
  body{display:block;overflow:visible;background:#fff}
  #editor,#toolbar{display:none!important}
  #preview{padding:0;background:#fff;display:block;overflow:visible}
  .stage{zoom:1!important;transform:none!important;gap:0}
  .doc-page{box-shadow:none;break-after:page}
  .doc-page:last-child{break-after:auto}
  .doc-page .line{border-top-width:.5pt}
  .grid-ov{display:none!important}
  @page{size:A4;margin:0}
}
</style>

  <h2>Projekt</h2>
  <div class="fg">
    <div class="fld wide"><label>Projektname</label><input type="text" id="f-proj-name" value="Kant Center – Parkhaus"></div>
    <div class="fld"><label>Straße</label><input type="text" id="f-proj-str" value="Krumme Str. 48"></div>
    <div class="fld"><label>PLZ / Ort</label><input type="text" id="f-proj-ort" value="10627 Berlin"></div>
  </div>

  <h2>Zeitraum</h2>
  <div class="fg">
    <div class="fld"><label>von</label><input type="date" id="f-von"></div>
    <div class="fld"><label>bis</label><input type="date" id="f-bis"></div>
  </div>
  <div class="btnbar">
    <button class="ghost" id="btn-load" disabled title="Kommt in Schritt 4: Zeiteinträge aus Google Sheets / AppSheet">Aus Zeitraum laden</button>
    <button class="ghost" id="btn-demo">Demodaten</button>
  </div>

  <h2>Zeiteinträge</h2>
  <div id="entries"></div>
  <div class="btnbar"><button class="ghost" id="btn-add">+ Zeile</button></div>

  <h2>Dokument</h2>
  <div class="btnbar">
    <button id="btn-print">Als PDF exportieren</button>
    <button class="ghost" id="btn-save">Speichern (.json)</button>
    <button class="ghost" id="btn-open">Öffnen</button>
    <input type="file" id="file-open" accept="application/json" hidden>
  </div>
  <p class="sub" style="margin-top:18px">Regeln &amp; Annahmen: <code>docs/</code>. Feedback → verfeinern.</p>
</div>

<script>
/* ============================================================
   1) DESIGN-SYSTEM  (globale Regeln, mm / pt / Rasterzeilen)
   ============================================================ */
const PT = p => p*25.4/72;
const MM_PER_CSSPX = 25.4/96;      // 1 CSS-px = 0.264583 mm
const BL = PT(13);                 // 1 Rastereinheit = 13 pt = 4.5861 mm
const DS = {
  page:{w:210,h:297}, margin:15, rightEdge:195,
  cols:12, colW:10.7957, gutter:BL,
  colX(n){ return 15 + (n-1)*(this.colW+this.gutter); },
  G(k){ return 15 + k*BL; },

  header:{
    monogram:{right:195, top:15, w:31.2, h:13.5},
    wordmarkTop1:14.6, wordmarkTop2:19.2,
    titleK:5, placedateK:7,
    ruleK:[5,7,9], ruleX1:122.65, ruleX2:195
  },
  meta:{ labelK:12, valK:[13,14,15] },
  table:{
    topRuleK_first:19, topRuleK_cont:12,
    rowSpan:2,
    maxRowK:52,
    cols:{ datum:1, taetigkeit:3, bearbeiter:8 }
  },
  total:{ span:2, labelCol:8 },
  footer:{ k1:57, k2:58, blocks:[1,3,6,8] }
};

/* Büroprofil — EIN Absender (ANN ARCHITECTURE). Später aus Google-Sheet »Company Info«. */
const BUERO = { blocks:[
  ["Wilmersdorfer Str. 108", "10627 Berlin"],
  ["info@annarchitecture-studio.com", "annarchitecturesolution.com"],
  ["Tel.: +49 1702828889", "USt-IdNr.: DE123456789"],
  ["Ann-Kathrin Salich", "Freischaffende Architektin"]
]};

const MONOGRAM_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88.33 38.33"><path d="M 0 38.33 L 5.10 38.33 L 24.97 0 L 20.01 0 L 0 38.33 Z"/><path d="M 83.88 0 L 83.88 31.12 L 61.19 0.10 L 61.11 0 L 56.53 0 L 56.53 30.83 L 34.05 0.10 L 33.97 0 L 29.39 0 L 29.39 38.33 L 33.83 38.33 L 33.83 7.20 L 56.76 38.33 L 60.97 38.33 L 60.97 7.21 L 83.72 38.22 L 83.79 38.33 L 88.33 38.33 L 88.33 0 L 83.88 0 Z"/></svg>`;

/* ============================================================
   2) DOKUMENT-MODELL
   ============================================================ */
let model = {
  type:"stundennachweis",
  header:{ title:"Anlage 01_Stundennachweis", place:"Berlin", date:isoToday() },
  meta:{
    auftrag:{ nr:"OFF_KHP_N_01_260301", bez:"Nachtrag 01 – Bodenmarkierungsplanung" },
    projekt:{ name:"Kant Center – Parkhaus", strasse:"Krumme Str. 48", ort:"10627 Berlin" },
    zeitraum:{ von:"", bis:"" }
  },
  items:[
    { datum:"", taetigkeit:"Erstellung von Plänen", bearbeiter:"Ann-Kathrin Salich", stunden:0.5 },
    { datum:"", taetigkeit:"Absprache mit APCOA",   bearbeiter:"Ann-Kathrin Salich", stunden:1.0 }
  ]
};
function isoToday(){ return new Date().toISOString().slice(0,10); }
function deDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}.${m}.${y}`; }
function hours(n){ return (Number(n)||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" Std."; }
function totalHours(){ return model.items.reduce((s,r)=>s+(Number(r.stunden)||0),0); }

/* ============================================================
   3) PAGINATION-ENGINE
   ============================================================ */
function paginate(){
  const first0 = DS.table.topRuleK_first + 1;
  const cont0  = DS.table.topRuleK_cont  + 1;
  const span = DS.table.rowSpan, maxK = DS.table.maxRowK;
  const capFirst = Math.max(0, Math.floor((maxK - first0)/span) + 1);
  const capCont  = Math.max(1, Math.floor((maxK - cont0 )/span) + 1);
  const pages = []; let rest = model.items.slice();
  if(!rest.length) rest = [null];
  let f = true;
  while(rest.length){ const cap = f?capFirst:capCont; pages.push({first:f, rows:rest.slice(0,cap)}); rest = rest.slice(cap); f = false; }
  pages[pages.length-1].last = true;
  return pages;
}

/* ============================================================
   4) RENDERER
   ============================================================ */
const stage = document.getElementById('stage');

function band(cls, o, text){
  const d = document.createElement('div');
  d.className = 'b ' + cls + (o.right ? ' r' : '') + (o.align === 'top' ? ' top' : '');
  const span = o.span || 1;
  d.style.top = (o.topMM != null ? o.topMM : DS.G(o.k)) + 'mm';
  d.style.height = (span*BL) + 'mm';
  if(o.right){ d.style.right = (DS.page.w - DS.rightEdge) + 'mm'; d.style.left = DS.colX(1) + 'mm'; }
  else       { d.style.left = o.leftMM + 'mm'; d.style.right = (DS.page.w - DS.rightEdge) + 'mm'; }
  if(text != null) d.textContent = text;
  return d;
}
function rule(page, k, x1, x2){
  const d = document.createElement('div'); d.className = 'line';
  d.dataset.topmm = DS.G(k);
  d.style.top = DS.G(k) + 'mm'; d.style.left = x1 + 'mm'; d.style.width = (x2 - x1) + 'mm';
  page.appendChild(d);
}

function renderHeader(page){
  page.appendChild(band('s-wordmark', {leftMM:DS.colX(1), topMM:DS.header.wordmarkTop1, align:'top'}, 'AN(N) ARCHITECTURE'));
  page.appendChild(band('s-wordmark', {leftMM:DS.colX(1), topMM:DS.header.wordmarkTop2, align:'top'}, 'SOLUTION'));
  const m = document.createElement('div'); m.className = 'monogram';
  m.style.left = (DS.header.monogram.right - DS.header.monogram.w) + 'mm';
  m.style.top = DS.header.monogram.top + 'mm';
  m.style.width = DS.header.monogram.w + 'mm'; m.style.height = DS.header.monogram.h + 'mm';
  m.innerHTML = MONOGRAM_SVG; page.appendChild(m);

  page.appendChild(band('s-title',     {right:true, k:DS.header.titleK,     span:2}, model.header.title || ''));
  page.appendChild(band('s-placedate', {right:true, k:DS.header.placedateK, span:2}, `${model.header.place}, ${deDate(model.header.date)}`));
  DS.header.ruleK.forEach(k => rule(page, k, DS.header.ruleX1, DS.header.ruleX2));
}

function renderMeta(page){
  const L = DS.colX(3), R = DS.colX(8);
  page.appendChild(band('s-metalabel', {leftMM:L, k:DS.meta.labelK}, 'AUFTRAG:'));
  page.appendChild(band('s-metaval',   {leftMM:L, k:DS.meta.valK[0]}, model.meta.auftrag.nr || ''));
  page.appendChild(band('s-metaval',   {leftMM:L, k:DS.meta.valK[1]}, model.meta.auftrag.bez || ''));
  page.appendChild(band('s-metalabel', {leftMM:R, k:DS.meta.labelK}, 'PROJEKT:'));
  page.appendChild(band('s-metaval',   {leftMM:R, k:DS.meta.valK[0]}, model.meta.projekt.name || ''));
  page.appendChild(band('s-metaval',   {leftMM:R, k:DS.meta.valK[1]}, model.meta.projekt.strasse || ''));
  page.appendChild(band('s-metaval',   {leftMM:R, k:DS.meta.valK[2]}, model.meta.projekt.ort || ''));
}

function renderTable(page, p){
  const topK = p.first ? DS.table.topRuleK_first : DS.table.topRuleK_cont;
  const C = DS.table.cols, span = DS.table.rowSpan;
  rule(page, topK, DS.colX(1), DS.rightEdge);
  page.appendChild(band('s-thead', {leftMM:DS.colX(C.datum),      k:topK}, 'DATUM'));
  page.appendChild(band('s-thead', {leftMM:DS.colX(C.taetigkeit), k:topK}, 'TÄTIGKEIT'));
  page.appendChild(band('s-thead', {leftMM:DS.colX(C.bearbeiter), k:topK}, 'BEARBEITER'));
  page.appendChild(band('s-thead', {right:true,                   k:topK}, 'ZEITAUFWAND'));
  rule(page, topK + 1, DS.colX(1), DS.rightEdge);
  const rows = p.rows.filter(Boolean);
  rows.forEach((row,i)=>{
    const bandTopK = topK + 1 + i*span;
    page.appendChild(band('s-cell', {leftMM:DS.colX(C.datum),      k:bandTopK, span}, deDate(row.datum) || '—'));
    page.appendChild(band('s-cell', {leftMM:DS.colX(C.taetigkeit), k:bandTopK, span}, row.taetigkeit || ''));
    page.appendChild(band('s-cell', {leftMM:DS.colX(C.bearbeiter), k:bandTopK, span}, row.bearbeiter || ''));
    page.appendChild(band('s-cell', {right:true,                   k:bandTopK, span}, hours(row.stunden)));
    rule(page, bandTopK + span, DS.colX(1), DS.rightEdge);
  });
  return topK + 1 + rows.length*span;
}

function renderTotal(page, k){
  const span = DS.total.span;
  page.appendChild(band('s-total', {leftMM:DS.colX(DS.total.labelCol), k, span}, 'Gesamt'));
  page.appendChild(band('s-total', {right:true,                        k, span}, hours(totalHours())));
  rule(page, k + span, DS.colX(1), DS.rightEdge);
}

function renderFooter(page, idx, count){
  BUERO.blocks.forEach((b,i)=>{
    page.appendChild(band('s-footer', {leftMM:DS.colX(DS.footer.blocks[i]), k:DS.footer.k1}, b[0]));
    page.appendChild(band('s-footer', {leftMM:DS.colX(DS.footer.blocks[i]), k:DS.footer.k2}, b[1]));
  });
  page.appendChild(band('s-footer', {right:true, k:DS.footer.k1}, 'Page'));
  page.appendChild(band('s-footer', {right:true, k:DS.footer.k2}, `${idx}/${count}`));
}

/* Raster-Overlay */
let showGrid = false;
function renderGrid(page){
  const ov = document.createElement('div'); ov.className = 'grid-ov';
  const f = document.createElement('div'); f.className = 'frame';
  f.style.left = DS.margin + 'mm'; f.style.top = DS.margin + 'mm';
  f.style.width = (DS.rightEdge - DS.margin) + 'mm';
  f.style.height = (DS.G(61) - DS.margin) + 'mm';
  ov.appendChild(f);
  for(let n=1;n<=DS.cols;n++){
    const c = document.createElement('div'); c.className = 'col';
    c.style.left = DS.colX(n) + 'mm'; c.style.width = DS.colW + 'mm';
    ov.appendChild(c);
  }
  for(let k=0;k<=61;k++){
    const b = document.createElement('div'); b.className = 'bl';
    b.style.top = DS.G(k) + 'mm';
    ov.appendChild(b);
  }
  page.appendChild(ov);
}

/* Linien exakt auf die Gerätepixel-Kante schieben -> alle gleich dick, kein Flimmern.
   Läuft nach jedem render() und bei jeder Zoomänderung. */
function snapLines(){
  const dpr = window.devicePixelRatio || 1;
  const scale = zoom * dpr / MM_PER_CSSPX;          // Geräte-px pro mm
  document.querySelectorAll('.doc-page .line').forEach(l=>{
    const mm = parseFloat(l.dataset.topmm);
    const dev = mm * scale;
    l.style.top = (Math.round(dev) / scale) + 'mm'; // auf ganze Geräte-px runden
  });
}

function render(){
  stage.innerHTML = '';
  const pages = paginate();
  pages.forEach((p,i)=>{
    const page = document.createElement('div'); page.className = 'doc-page';
    if(showGrid) renderGrid(page);
    renderHeader(page);
    if(p.first) renderMeta(page);
    const lastRowK = renderTable(page, p);
    if(p.last) renderTotal(page, lastRowK);
    renderFooter(page, i+1, pages.length);
    stage.appendChild(page);
  });
  fitZoom(false);
  snapLines();
}

/* ============================================================
   5) EDITOR
   ============================================================ */
const $ = s => document.querySelector(s);
function setPath(path,v){ const s=path.split('.'); let o=model; for(let i=0;i<s.length-1;i++)o=o[s[i]]; o[s[s.length-1]]=v; }
function bind(id,path){ const el=$(id); el.addEventListener('input',()=>{ setPath(path,el.value); render(); }); }
/* Titel ist vorerst nur frei editierbar. Wie er sich später automatisch ergibt,
   hängt an der Gesamt-Datenstruktur/-Benennung (offen: docs regel-register O-003). */
bind('#f-title','header.title');
bind('#f-place','header.place'); bind('#f-date','header.date');
bind('#f-auftrag-nr','meta.auftrag.nr'); bind('#f-auftrag-bez','meta.auftrag.bez');
bind('#f-proj-name','meta.projekt.name'); bind('#f-proj-str','meta.projekt.strasse'); bind('#f-proj-ort','meta.projekt.ort');
bind('#f-von','meta.zeitraum.von'); bind('#f-bis','meta.zeitraum.bis');

const entriesBox = $('#entries');
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderEntries(){
  entriesBox.innerHTML = '<div class="e-head"><div>Datum</div><div>Tätigkeit</div><div>Bearbeiter</div><div>Std.</div><div></div></div>';
  model.items.forEach((r,i)=>{
    const row = document.createElement('div'); row.className='e-row';
    row.innerHTML =
      `<input type="date" data-i="${i}" data-k="datum" value="${r.datum||''}">`+
      `<input type="text" data-i="${i}" data-k="taetigkeit" value="${escapeHtml(r.taetigkeit)}">`+
      `<input type="text" data-i="${i}" data-k="bearbeiter" value="${escapeHtml(r.bearbeiter)}">`+
      `<input type="number" step="0.25" class="num" data-i="${i}" data-k="stunden" value="${r.stunden??''}">`+
      `<button class="del" data-i="${i}" title="Zeile löschen">×</button>`;
    entriesBox.appendChild(row);
  });
  const tot = document.createElement('div'); tot.className='e-total';
  tot.innerHTML = `<span>Gesamt</span><span>${hours(totalHours())}</span>`;
  entriesBox.appendChild(tot);
}
entriesBox.addEventListener('input', e=>{
  const i=+e.target.dataset.i, k=e.target.dataset.k; if(k==null) return;
  model.items[i][k] = k==='stunden' ? parseFloat(e.target.value)||0 : e.target.value;
  renderEntries(); render();
});
entriesBox.addEventListener('click', e=>{
  if(!e.target.classList.contains('del')) return;
  model.items.splice(+e.target.dataset.i,1); renderEntries(); render();
});
$('#btn-add').onclick = ()=>{ model.items.push({datum:"",taetigkeit:"",bearbeiter:"Ann-Kathrin Salich",stunden:0}); renderEntries(); render(); };
$('#btn-demo').onclick = ()=>{
  const acts=["Erstellung von Plänen","Absprache mit APCOA","Baustellenbegehung","Abstimmung Fachplaner","Ausschreibungstext","Mengenermittlung"];
  model.items = Array.from({length:14},(_,k)=>({
    datum:`2026-08-${String(3+k).padStart(2,'0')}`, taetigkeit:acts[k%6],
    bearbeiter:"Ann-Kathrin Salich", stunden:[0.5,1,2,1.5,3,0.75][k%6]
  }));
  renderEntries(); render();
};

$('#btn-save').onclick = ()=>{
  const blob = new Blob([JSON.stringify(model,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `${(model.header.title||'stundennachweis').replace(/[^\w-]+/g,'_')}.json`; a.click();
};
$('#btn-open').onclick = ()=> $('#file-open').click();
$('#file-open').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ model=JSON.parse(rd.result); syncForm(); renderEntries(); render(); }catch(err){ alert('Datei nicht lesbar: '+err); } };
  rd.readAsText(f);
};
$('#btn-print').onclick = ()=> window.print();

function syncForm(){
  const g=(id,v)=>{ $(id).value = v||''; };
  g('#f-title',model.header.title);
  g('#f-place',model.header.place); g('#f-date',model.header.date);
  g('#f-auftrag-nr',model.meta.auftrag.nr); g('#f-auftrag-bez',model.meta.auftrag.bez);
  g('#f-proj-name',model.meta.projekt.name); g('#f-proj-str',model.meta.projekt.strasse); g('#f-proj-ort',model.meta.projekt.ort);
  g('#f-von',model.meta.zeitraum.von); g('#f-bis',model.meta.zeitraum.bis);
}

/* ---- Zoom ---- */
let zoom = 1, userZoomed = false;
function applyZoom(){ stage.style.zoom = zoom; snapLines(); }
function fitZoom(reset){
  const avail = document.getElementById('preview').clientWidth - 60;
  const target = Math.max(0.35, Math.min(1.9, avail / (210/MM_PER_CSSPX)));
  if(reset || !userZoomed) zoom = target;
  applyZoom();
}
$('#btn-zoom-in').onclick  = ()=>{ userZoomed=true; zoom=Math.min(3,zoom+0.15); applyZoom(); };
$('#btn-zoom-out').onclick = ()=>{ userZoomed=true; zoom=Math.max(0.2,zoom-0.15); applyZoom(); };
$('#btn-zoom-fit').onclick = ()=>{ userZoomed=false; fitZoom(true); };
$('#btn-grid').onclick = ()=>{
  showGrid = !showGrid;
  $('#btn-grid').style.background = showGrid ? 'var(--ink)' : '#fff';
  $('#btn-grid').style.color = showGrid ? '#fff' : 'var(--ink)';
  render();
};
window.addEventListener('resize', ()=> fitZoom(true));

/* ---- Start ---- */
model.header.date = isoToday();
syncForm(); renderEntries(); render(); fitZoom(true);
</script>
</body>
</html>
